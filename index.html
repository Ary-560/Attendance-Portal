<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--top:#f4682d;--bg:#f2f5fa;--card:#fff;--ink:#1f2937;--mute:#6b7688;--line:#e6eaf1;--row:#f6f8fc;--c1:#3b66f5;--c2:#a3b9fa;--acc:#f4682d;--accSoft:#fde9e0;--ok:#16895c;--okBg:#d9f2e6;--no:#d0443b;--noBg:#fbe3e0;--late:#a8680c;--lateBg:#fbebcc;--sh:0 1px 3px rgba(31,41,55,.06);
--f:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--top:#c9501f;--bg:#0f1622;--card:#182131;--ink:#e8edf6;--mute:#9aa8bf;--line:#26324a;--row:#1c2739;--c1:#6a8bff;--c2:#34456f;--accSoft:#3a2418;--ok:#4cc790;--okBg:#143a2b;--no:#f0766f;--noBg:#41201f;--late:#ecb457;--lateBg:#403112;--sh:none}}
:root[data-theme="dark"]{--top:#c9501f;--bg:#0f1622;--card:#182131;--ink:#e8edf6;--mute:#9aa8bf;--line:#26324a;--row:#1c2739;--c1:#6a8bff;--c2:#34456f;--accSoft:#3a2418;--ok:#4cc790;--okBg:#143a2b;--no:#f0766f;--noBg:#41201f;--late:#ecb457;--lateBg:#403112;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--top);z-index:30}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:56px;background:var(--top);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px}
.top .brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px;flex:1}
.top .brand small{display:block;font-size:10px;font-weight:500;opacity:.85;letter-spacing:.08em;text-transform:uppercase;line-height:1}
.lg{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--top);display:grid;place-items:center}
.ib{background:#ffffff26;border:0;color:#fff;border-radius:8px;height:36px;padding:0 12px;font-weight:600;display:flex;align-items:center;gap:6px}
.hello{display:flex;align-items:center;gap:9px;font-size:12px;line-height:1.2}
.av{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--top);display:grid;place-items:center;font-weight:700}
#burger{display:none}
.shell{display:flex;align-items:flex-start}
aside{width:220px;flex:none;background:var(--card);border-right:1px solid var(--line);position:sticky;top:calc(56px + env(safe-area-inset-top,0px));height:calc(100vh - 56px);padding:12px 0;overflow-y:auto}
aside button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 18px;color:var(--mute);font-weight:500;text-align:left;border-left:4px solid transparent}
aside button.on{background:var(--accSoft);color:var(--acc);border-left-color:var(--acc);font-weight:700}
aside svg,.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{flex:1;min-width:0;padding:22px 24px 40px;max-width:1100px}
h1{font-size:21px;font-weight:600;margin:0 0 4px}h3{font-size:14px;margin:0;font-weight:700}
.sub{color:var(--mute);margin:0 0 16px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px}
.sel,select,input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 12px;font-weight:500}
input[type=date]{min-height:38px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--sh);margin-bottom:18px}
.grid2{display:grid;grid-template-columns:5fr 7fr;gap:18px}
.grid2 .card{margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center}
.stat i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-weight:700;background:var(--accSoft);color:var(--acc)}
.stat b{display:block;font-size:22px;line-height:1.1}.stat span{color:var(--mute);font-size:12px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.donut{display:block;margin:6px auto 12px;width:210px;max-width:100%}
.legend{display:flex;justify-content:center;gap:22px;color:var(--mute);font-size:12.5px}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;background:var(--c1);vertical-align:-1px}
.legend span+span::before{background:var(--c2)}
.chart{display:flex;gap:8px;height:210px}
.yax{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--mute);text-align:right;padding-bottom:22px}
.bars{flex:1;display:flex;gap:10px;align-items:stretch;background:repeating-linear-gradient(to top,transparent 0,transparent calc(25% - 1px),var(--line) calc(25% - 1px),var(--line) 25%);background-size:100% calc(100% - 22px);background-repeat:no-repeat}
.b{flex:1;display:flex;flex-direction:column;min-width:0}
.b div{flex:1;display:flex;flex-direction:column;justify-content:flex-end}
.b i{display:block;background:var(--c2);width:100%}.b i+i{background:var(--c1)}
.b small{height:22px;font-size:10.5px;color:var(--mute);text-align:center;padding-top:4px;white-space:nowrap;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12.5px;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;white-space:nowrap;font-size:13px}
tbody tr:nth-child(odd) td{background:var(--row)}
.bar{height:9px;background:var(--c2);border-radius:9px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--c1)}.bar i.low{background:var(--no)}
.tag{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;display:inline-block}
.tag.ok{background:var(--okBg);color:var(--ok)}.tag.no{background:var(--noBg);color:var(--no)}.tag.late{background:var(--lateBg);color:var(--late)}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:8px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.sm{padding:5px 10px;font-size:12px}.btn.del{color:var(--no)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mute);flex:1;min-width:130px}
label input,label select{width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 13px;font-weight:600;color:var(--mute)}.seg button+button{border-left:1px solid var(--line)}
.seg .P.on{background:var(--ok);color:#fff}.seg .A.on{background:var(--no);color:#fff}.seg .L.on{background:#e59a1f;color:#2a1a00}
.ring{--v:0;--c:var(--c1);width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--c2) 0);display:grid;place-items:center;flex:none}
.ring.low{--c:var(--no)}.ring div{width:92px;height:92px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:24px;font-weight:700}
.note{padding:11px 14px;border-radius:10px;background:var(--lateBg);color:var(--late);font-weight:600;margin-top:14px}.note.ok{background:var(--okBg);color:var(--ok)}
.msg{color:var(--ok);font-weight:600;margin-left:10px}.err{color:var(--no);font-size:12px;min-height:18px}.muted{color:var(--mute)}
.hide{display:none!important}
#modal{position:fixed;inset:0;background:#0008;z-index:40;display:grid;place-items:center;padding:16px}
.mc{background:var(--card);border-radius:16px;max-width:400px;width:100%;padding:24px;box-shadow:0 20px 60px #0005}
.mc h3{font-size:19px;margin-bottom:2px}.mc label{margin-bottom:12px}
.seg.role{display:flex;margin:14px 0}.seg.role button{flex:1}.seg.role button.on{background:var(--acc);color:#fff}
#acct{display:flex;align-items:center;gap:10px}
.gnote{padding:11px 14px;border-radius:10px;background:var(--accSoft);color:var(--acc);font-weight:600;margin:0 0 14px}
#scrim{display:none}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media(max-width:860px){
 #burger{display:flex}.hello span{display:none}
 aside{position:fixed;left:0;top:calc(56px + env(safe-area-inset-top,0px));bottom:0;height:auto;z-index:25;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.2)}
 aside.open{transform:none}
 #scrim.open{display:block;position:fixed;inset:0;background:#0006;z-index:22}
 main{padding:16px 14px 40px}
}

:root{--g1:#ff7a3d;--g2:#f4366e;--g3:#8f3bd6}

body::before{background:linear-gradient(110deg,var(--g1),var(--g2))}
.top{background:linear-gradient(110deg,var(--g1),var(--g2) 60%,var(--g3));box-shadow:0 4px 18px rgba(244,54,110,.28)}
.lg,.av{color:var(--g2)}
.ib#loginOpen{background:#fff;color:var(--g2);font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.gl{border:0;border-radius:12px;padding:11px 20px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 6px 16px rgba(244,54,110,.35),inset 0 1px 0 rgba(255,255,255,.45);position:relative;overflow:hidden;transition:transform .15s}

.gl.alt{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);backdrop-filter:blur(6px)}

.gl:hover::after{transform:translateX(120%)}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:44px 36px;margin-bottom:22px;color:#fff;background:radial-gradient(600px 300px at 85% 0%,rgba(255,122,61,.55),transparent 60%),radial-gradient(500px 300px at 0% 100%,rgba(143,59,214,.6),transparent 60%),linear-gradient(135deg,#101a3a,#1c2a63);display:flex;gap:28px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 14px 40px rgba(20,30,80,.35)}
.sheen{position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);transform:translateX(-100%);animation:sh 5s ease-in-out infinite;pointer-events:none}
@keyframes sh{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.hl{max-width:520px;position:relative}.hero h1{font-size:clamp(26px,4.4vw,40px);line-height:1.15;font-weight:800;margin:12px 0;color:#fff}
.hero p{opacity:.88;margin:0 0 20px;font-size:15px}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.hs{display:grid;gap:12px;position:relative}
.chip{min-width:170px;padding:14px 18px;border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(10px);font-size:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.chip b{display:block;font-size:26px}
.welcome{position:relative;overflow:hidden;border-radius:16px;padding:20px 24px;margin-bottom:20px;color:#fff;background:linear-gradient(120deg,#1c2a63,var(--g3) 70%,var(--g2))}
.welcome h2{margin:0;font-size:20px}.welcome p{margin:4px 0 0;opacity:.88}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}
.feat .card{margin:0;transition:transform .2s;border-top:3px solid var(--g2)}.feat .card:hover{transform:translateY(-4px)}.feat b{display:block;font-size:15px;margin-bottom:4px}
.card,.stat{border-radius:16px;box-shadow:0 8px 24px rgba(31,41,55,.07)}
.stat{transition:transform .2s}.stat:hover{transform:translateY(-3px)}
.stat i{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 4px 10px rgba(244,54,110,.35)}
.b i+i{background:linear-gradient(180deg,#6f93ff,var(--c1))}
.bar i{background:linear-gradient(90deg,#6f93ff,var(--c1))}.bar i.low{background:var(--no)}
.btn.pri{background:linear-gradient(135deg,var(--g1),var(--g2));border:0;box-shadow:0 4px 12px rgba(244,54,110,.3),inset 0 1px 0 rgba(255,255,255,.4)}
aside button.on{background:linear-gradient(90deg,var(--accSoft),transparent);border-left-color:var(--g2);color:var(--g2)}
#modal{background:rgba(10,16,40,.6);backdrop-filter:blur(6px)}
.mc{border-radius:20px;border-top:4px solid var(--g2)}
.seg.role button.on{background:var(--g2);color:#fff}

@media(max-width:860px){.feat{grid-template-columns:1fr}.hero{padding:28px 20px}.hs{grid-template-columns:repeat(3,1fr);width:100%}.chip{min-width:0;padding:10px}.chip b{font-size:20px}}
@media (prefers-reduced-motion:reduce){.sheen{animation:none}}

aside{width:250px;background:linear-gradient(180deg,#182a52,#101c3a);border-right:0;padding:0 0 16px;color:#cdd9f3;display:flex;flex-direction:column}
.sb{display:flex;align-items:center;gap:12px;padding:20px 18px 18px;font-weight:700;font-size:15px;line-height:1.25;color:#fff}
.sb svg{width:38px!important;height:38px!important;stroke-width:1.6!important;color:#fff}
aside button{color:#c3d1f0;margin:2px 10px;width:calc(100% - 20px);padding:13px 14px;border-radius:10px;border-left:0;font-size:15px;font-weight:500;transition:background .15s}
aside button:hover{background:rgba(255,255,255,.08)}
aside button.on,aside button.on:hover{background:linear-gradient(135deg,#3b7bff,#2457e6);color:#fff;border-left:0;font-weight:600;box-shadow:0 6px 16px rgba(36,87,230,.45)}
aside button svg{width:20px;height:20px}
aside button.out{margin-top:6px;border-top:1px solid rgba(255,255,255,.08);border-radius:0 0 10px 10px}
@media(min-width:861px){.top .brand>*{display:none}}
aside svg.f{fill:currentColor;stroke:none}.sb svg.f{width:40px!important;height:40px!important}
@media(max-width:860px){#logout{display:none}.hello>div+div{display:none}.top .brand{min-width:0;overflow:hidden}.top{gap:8px;padding:0 12px}}
</style>

<body>

  <button class="ib" id="burger" aria-label="Menu"></button>

}
const openM=()=>{modalUI();$('#modal').classList.remove('hide')};
const closeM=()=>$('#modal').classList.add('hide');
function doLogin(){const E=m=>{$('#lerr').textContent=m};
  if(lrole==='teacher'){if($('#u').value.trim()!=='admin'||$('#pw').value!==((D.cfg||{}).pw||'admin123'))return E('Wrong username or password.');session={role:'teacher'};page='dash'}
  else if(lrole==='student'){const x=D.students.find(s=>s.classId===$('#lc').value&&s.roll===parseInt($('#lr').value,10)&&(s.pin||'1234')===$('#lp').value);if(!x)return E('No student found. Check class, roll number and PIN.');session={role:'student',ids:[x.id]};vs=x.id;page='view'}
  else{const m=$('#lm').value.trim(),ks=D.students.filter(s=>s.parent&&s.parent===m&&(s.pin||'1234')===$('#lp').value);if(!ks.length)return E('No child found. Check mobile number and PIN.');session={role:'parent',ids:ks.map(k=>k.id)};vs=ks[0].id;page='view'}
  closeM();render();scrollTo(0,0)}
function render(){
  document.body.classList.toggle('guest',!session);
  if(!allowed().includes(page))page='dash';
  if(page!=='dash'&&selClass==='all')selClass=(D.classes[0]||{}).id||'';
  $('#side').innerHTML=`<div class="sb">${fi('cap')}<span>${esc((D.cfg||{}).inst||'Online Attendance Management System')}</span></div>`+allowed().map(k=>`<button class="${k===page?'on':''}" data-p="${k}">${fi(PAGES[k][1])}${plabel(k)}</button>`).join('')+(session?`<button class="out" data-p="logout">${ic('logout')}Logout</button>`:`<button class="out" data-p="login">${fi('user')}Login</button>`);
  $('#acct').innerHTML=acct();
  $('#main').innerHTML={dash,att,stu,rep,view,fac,set}[page]();
}
function go(p){page=p;flash='';$('#side').classList.remove('open');$('#scrim').classList.remove('open');render();scrollTo(0,0)}
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeM();return}
  const t=e.target.closest('button,#scrim');if(!t)return;
  if(t.id==='burger'||t.id==='scrim'){$('#side').classList.toggle('open');$('#scrim').classList.toggle('open');return}
  if(t.id==='theme'){const h=document.documentElement;const d=(h.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark';h.dataset.theme=d?'light':'dark';return}
  if(t.dataset.login){lrole=t.dataset.login;return openM()}
  if(t.id==='loginOpen')return openM();
  if(t.id==='mclose')return closeM();
  if(t.dataset.lr){lrole=t.dataset.lr;return modalUI()}
  if(t.id==='loginBtn')return doLogin();
  if(t.id==='logout'){session=null;page='dash';selClass='all';return render()}
  if(t.dataset.p==='logout'){session=null;page='dash';selClass='all';$('#side').classList.remove('open');$('#scrim').classList.remove('open');return render()}
  if(t.dataset.p==='login'){$('#side').classList.remove('open');$('#scrim').classList.remove('open');return openM()}
  if(t.dataset.p)return go(t.dataset.p);
  if(t.dataset.m){const k=selClass+'|'+selDate;(tmp[k]=tmp[k]||{})[t.dataset.s]=t.dataset.m;flash='';return render()}
  if(t.dataset.od){selDate=t.dataset.od;flash='';return render()}
  if(t.dataset.delf){D.faculty=(D.faculty||[]).filter(f=>f.id!==t.dataset.delf);save();return render()}
  if(t.dataset.del){D.students=D.students.filter(s=>s.id!==t.dataset.del);save();return render()}
  switch(t.dataset.a){
   case'demo':if(confirm('Replace current data with demo data?')){demo();selClass=D.classes[0].id;render()}break;
   case'addc':{const v=$('#cn').value.trim();if(!v){$('#e1').textContent='Enter a class name.';break}const id=uid();D.classes.push({id,name:v});selClass=id;save();render();break}
   case'delc':if(confirm('Delete this class, its students and attendance?')){D.students=D.students.filter(s=>s.classId!==selClass);Object.keys(D.att).forEach(k=>{if(k.startsWith(selClass+'|'))delete D.att[k]});D.classes=D.classes.filter(c=>c.id!==selClass);selClass=(D.classes[0]||{}).id||'';save();render()}break;
   case'adds':{const r=parseInt($('#sr').value,10),n=$('#sn').value.trim(),pm=$('#sp').value.replace(/\D/g,'');
     if(!selClass||!r||!n){$('#e2').textContent='Select a class and enter roll number and name.';break}
     if(D.students.some(s=>s.classId===selClass&&s.roll===r)){$('#e2').textContent='Roll '+r+' already exists.';break}
     if(pm&&pm.length!==10){$('#e2').textContent='Parent mobile must be 10 digits.';break}
     D.students.push({id:uid(),classId:selClass,roll:r,name:n,parent:pm,pin:$('#sk').value.trim()||'1234'});save();render();break}
   case'allp':{const k=selClass+'|'+selDate;tmp[k]={};D.students.filter(s=>s.classId===selClass).forEach(s=>tmp[k][s.id]='P');render();break}
   case'save':{const k=selClass+'|'+selDate;const m={};D.students.filter(s=>s.classId===selClass).forEach(s=>{m[s.id]=(tmp[k]||{})[s.id]||(D.att[k]||{})[s.id]||'P'});D.att[k]=m;delete tmp[k];save();flash='Saved';render();break}
   case'csv':csv();break
   case'addf':{const n=$('#fn').value.trim(),m=$('#fm').value.replace(/\D/g,'');if(!n){$('#e3').textContent='Enter the faculty name.';break}if(m&&m.length!==10){$('#e3').textContent='Mobile must be 10 digits.';break}(D.faculty=D.faculty||[]).push({id:uid(),name:n,dept:$('#fd').value.trim(),subject:$('#fs').value.trim(),cls:$('#ffc').value,mobile:m});save();render();break}
   case'savecfg':{D.cfg=D.cfg||{};D.cfg.inst=$('#si').value.trim();const pw=$('#sw').value;if(pw){if(pw.length<4){$('#e4').textContent='Password must be at least 4 characters.';break}D.cfg.pw=pw}save();render();break}
   case'th-light':document.documentElement.dataset.theme='light';break
   case'th-dark':document.documentElement.dataset.theme='dark';break
   case'clear':if(confirm('Delete ALL classes, students, faculty and attendance?')){D={classes:[],students:[],att:{},faculty:[]};selClass='all';save();render()}break}
});
document.addEventListener('change',e=>{const i=e.target.id;
  if(i==='fc'||i==='cs'){selClass=e.target.value;flash='';render()}
  if(i==='q'){q=e.target.value;render()}
  if(i==='dfo'){defOnly=e.target.checked;render()}
  if(i==='fp'){period=+e.target.value;render()}
  if(i==='dt'){selDate=e.target.value||selDate;flash='';render()}
  if(i==='vsel'){vs=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if(e.key==='Enter'&&!$('#modal').classList.contains('hide'))doLogin()});
$('#burger').innerHTML=ic('menu');$('#lg').innerHTML=ic('check').replace('<svg','<svg style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3"');
load();if(!D.classes.length)demo();selClass='all';render();
</script>
</body>
</html>
